services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - backend_net

  api:
    build:
      context: ./backend
    depends_on:
      - db
    environment:
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - frontend_net
      - backend_net

  php:
    image: php:8.2-fpm
    environment:
      APP_ENV: ${APP_ENV}
    volumes:
      - ./frontend/public:/var/www/html
    networks:
      - frontend_net
      - backend_net

  nginx:
    image: nginx:alpine
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./frontend/public:/var/www/html
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend_net

volumes:
  mysql_data:

networks:
  frontend_net:
  backend_net: